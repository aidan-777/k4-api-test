[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
markers =
    health: 健康检查及公共信息测试
    loan: 借款相关测试
    repay: 还款相关测试
    accounts: 账户查询及模式切换测试
    internal: 内部接口测试
    params: 参数接口测试
