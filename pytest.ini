[pytest]
testpaths =
    tests
    tavern
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
tavern-global-cfg =
    tavern/global.yaml
markers =
    health: 健康检查及公共信息测试
    loan: 借款相关测试
    repay: 还款相关测试
    accounts: 账户查询及模式切换测试
    internal: 内部接口测试
    params: 参数接口测试
    market: 行情/价格相关测试
    exchange: 交易代理(exchange)相关测试
    real_wallet: 需要真实钱包/可能有副作用的测试
    margin: 保证金相关测试（若服务支持）
    position: 仓位/平仓相关测试（若服务支持）
