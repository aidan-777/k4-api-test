[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
markers =
    health: 健康检查相关测试
    loan: 借款相关测试
    redeem: 赎回相关测试
    margin: 保证金相关测试
    position: 仓位相关测试
    internal: 内部接口测试
    mock: Mock 数据相关测试

